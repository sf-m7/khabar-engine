# .github/workflows/reports_weekly.yml
# Weekly client + internal reports. Runs Mondays 06:00 UTC — AFTER the maintenance
# chain (03:00-04:00), signal compute, and integrity audit (05:00), so reports
# read fresh, compacted data. Commits the generated files straight into /reports.

name: Reports (weekly)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write        # required to commit the reports back to the repo

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install psycopg2-binary pandas matplotlib duckdb

      - name: Market Demand & Stockout report
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KHABAR_DB_URL: ${{ secrets.PLANETSCALE_DB_URL }}
        run: python report_bestseller.py

      - name: Data Integrity report
        env:
          SUPABASE_DB_URL:      ${{ secrets.SUPABASE_DB_URL }}
          KHABAR_DB_URL: ${{ secrets.PLANETSCALE_DB_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
        run: python report_integrity.py

      - name: Commit reports
        run: |
          git config user.name  "khabar-bot"
          git config user.email "bot@khabar.local"
          git add reports/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "reports: weekly $(date -u +%Y-%m-%d)"
          git pull --rebase origin main      # avoid racing a concurrent push
          git push
