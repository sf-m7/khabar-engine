name: Health Check

# Runs after the day's pipeline has finished: Shopify scrapes, the LCW evening
# block, and compute_signals have all landed by ~20:00 UTC.
#
# Deliberately a SEPARATE workflow rather than a step inside the scraper. If it
# lived in the scraper, a scraper crash would take the health check down with
# it — losing the alarm at the exact moment it is needed most.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run health check
        id: check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          python -u health_check.py 2>&1 | tee report.txt

      # Only fires when the step above exits non-zero. GitHub already emails on
      # a failed run; this puts the actual failing checks on your phone, which
      # is the difference between knowing something broke and knowing what.
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "No TELEGRAM_ALERT_CHAT_ID set — skipping notification."
            exit 0
          fi
          BODY=$(grep -E '^❌' report.txt | head -20)
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode text="🚨 Khabar health check FAILED

${BODY}

Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
