name: Health Check

# Runs after the day's pipeline has finished: Shopify scrapes, the LCW evening
# block, and compute_signals have all landed by ~20:00 UTC.
#
# Deliberately a SEPARATE workflow rather than a step inside the scraper. If it
# lived in the scraper, a scraper crash would take the health check down with
# it — losing the alarm at the exact moment it is needed most.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run health check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KHABAR_DB_URL: ${{ secrets.PLANETSCALE_DB_URL }}
        run: |
          set -o pipefail
          python -u health_check.py 2>&1 | tee report.txt

      # Only fires when the step above exits non-zero. GitHub already emails on
      # a failed run; this puts the actual failing checks on your phone, which
      # is the difference between knowing something broke and knowing what.
      #
      # The message is assembled into a file and sent with text@msg.txt rather
      # than inlined into the curl command. A multi-line shell string spanning
      # YAML lines is fragile and was breaking the parse.
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_ALERT_CHAT_ID" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Telegram secrets not set - skipping notification."
            exit 0
          fi
          {
            echo "Khabar health check FAILED"
            echo ""
            # v14.48 fix: previously filtered with `grep '^\xe2\x9d\x8c'`,
            # trying to match the ❌ emoji by raw bytes. That pattern silently
            # matched nothing — grep's \x escape handling isn't reliable
            # across locales/versions in -E mode — so every alert arrived with
            # an empty body: no brand, no signal, nothing to act on.
            #
            # The report is already short (the checker only ever prints real
            # problems), so there's no need to filter it at all. Sending it
            # whole is simpler and can't silently drop content the way a
            # pattern match can.
            cat report.txt
            echo ""
            echo "Run: $RUN_URL"
          } > msg.txt

          # v14.47 fix: the response was previously discarded to /dev/null, so
          # a rejected send (bad chat id, revoked token, bot never messaged
          # first) failed with zero visibility — exactly the silent-failure
          # pattern this whole feature exists to prevent. Now captured and
          # printed, and a non-2xx or {"ok":false} fails this step so it shows
          # up red instead of quietly doing nothing.
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode text@msg.txt)

          echo "Telegram API response (HTTP $HTTP_CODE):"
          cat response.json
          echo ""

          if [ "$HTTP_CODE" != "200" ] || grep -q '"ok":false' response.json; then
            echo "❌ Telegram send failed — see response above."
            exit 1
          fi
          echo "✅ Telegram alert sent."
