name: TEMP — Khabar LCW Size Backfill

# Manual-trigger only, deliberately — this is a one-time catch-up job, not
# part of the daily schedule. Run it as many times as you like (each run
# picks up wherever the last one left off, since it always queries for
# size IS NULL). Delete this file and lcw_size_backfill.py once the log
# reports "All LCW variants already have size data."
on:
  workflow_dispatch:
    inputs:
      size_cap:
        description: "Max product URLs to fetch this run"
        type: string
        default: "3000"
      time_limit_minutes:
        description: "Hard wall-clock ceiling for this run, in minutes"
        type: string
        default: "45"

# v14.41: share the LCW scraper's concurrency group. scraper_lcw.yml now runs
# HOURLY, and this job can run for 45 minutes — so without this they overlap,
# competing for the same DataImpulse account and upserting the same
# product_variants rows (both passes target variants where size IS NULL).
# Same group + cancel-in-progress:false means GitHub queues one behind the
# other instead of running both.
concurrency:
  group: lcw-scraper
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Pull the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LCW size backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DATAIMPULSE_PROXY_USERNAME: ${{ secrets.DATAIMPULSE_PROXY_USERNAME }}
          DATAIMPULSE_PROXY_PASSWORD: ${{ secrets.DATAIMPULSE_PROXY_PASSWORD }}
          DATAIMPULSE_HOST: ${{ vars.DATAIMPULSE_HOST }}
          SCRAPE_TARGET: lcw
          BACKFILL_SIZE_CAP: ${{ inputs.size_cap }}
          # v14.41: the backfill imports get_lcw_session() from scraper.py, so
          # it inherits the Turkey switch, HTTP/1.1 pinning and country-pool
          # rotation automatically — but only if these are passed through.
          # Without them the script silently falls back to the code defaults
          # and ignores whatever you set in the GitHub UI.
          LCW_PROXY_COUNTRY: ${{ vars.LCW_PROXY_COUNTRY }}
          LCW_FORCE_HTTP1: ${{ vars.LCW_FORCE_HTTP1 }}
          LCW_PAGE_TIMEOUT: ${{ vars.LCW_PAGE_TIMEOUT }}
        run: |
          # time_limit_minutes is entered in minutes for readability in the
          # GitHub UI; the script wants seconds, so convert here.
          export BACKFILL_TIME_LIMIT_SECONDS=$(( ${{ inputs.time_limit_minutes }} * 60 ))
          python -u lcw_size_backfill.py
