name: Khabar Cold Archive

on:
  schedule:
    # Mondays 04:00 UTC — after the weekly rollup (03:00 UTC) has finished,
    # so the rollup always sees the full untouched window before anything
    # is archived/deleted out of price_snapshots. Same self-healing
    # philosophy as rollup.yml: if a Monday is missed, the next run simply
    # finds more eligible rows and processes them — nothing is lost by a
    # delay, since the gate (verify-before-delete) controls correctness,
    # not the schedule.
    #
    # NOTE: the scheduled trigger NEVER sets dry_run or threshold_override —
    # those inputs only exist on the manual workflow_dispatch trigger below,
    # specifically so a pilot test can never accidentally become the
    # production schedule's behaviour.
    - cron: "20 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pilot mode: run the full pipeline (export, upload, verify) but skip the actual delete. Use this to test before trusting a real run."
        type: boolean
        default: true
      threshold_override_days:
        description: "Archive rows older than this many days, for THIS manual run only. Leave at 21 for a realistic test; lower it (e.g. 5) to pilot against young real data."
        type: string
        default: "21"

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Pull the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cold archive
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          # These two only ever resolve to a non-default value when this run
          # was started by workflow_dispatch — github.event.inputs is empty
          # on a schedule trigger, so a scheduled run always falls back to
          # ARCHIVE_DRY_RUN=false and the real 35-day threshold, regardless
          # of what any past manual run used.
          ARCHIVE_DRY_RUN:                 ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          ARCHIVE_THRESHOLD_DAYS_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.threshold_override_days || '21' }}
        run: python -u archive.py
