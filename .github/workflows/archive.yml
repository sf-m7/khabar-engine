name: Khabar Cold Archive

on:
  schedule:
    # Mondays 04:00 UTC — after the weekly rollup (03:00 UTC) has finished,
    # so the rollup always sees the full untouched window before anything
    # is archived/deleted out of price_snapshots. Same self-healing
    # philosophy as rollup.yml: if a Monday is missed, the next run simply
    # finds more eligible rows and processes them — nothing is lost by a
    # delay, since the gate (verify-before-delete) controls correctness,
    # not the schedule.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Pull the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cold archive
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
        run: python -u archive.py
