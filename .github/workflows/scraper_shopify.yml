name: Khabar Shopify Scraper

on:
  schedule:
    # 4x daily at 1, 7, 13, 19 UTC — deliberately offset 1 hour from midnight
    # so this never runs concurrently with the LCW scraper (which runs at 0:00).
    # Concurrent runs caused DB conflicts and housecleaning crashes.
    # Shopify brands use NO proxy — zero Webshare bandwidth cost.
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Pull the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Shopify scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCRAPE_TARGET: shopify
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: python -u scraper.py
