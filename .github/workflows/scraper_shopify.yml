name: Khabar Shopify Scraper

on:
  schedule:
    # 3x daily (reduced from 4x) — trims ~25% of the per-run database egress.
    # Times are UTC. The LAST run (20:00 UTC ≈ 23:00 Cairo) is the day's "close":
    # each day's snapshot keeps the LATEST price it sees (sync_snapshot_price),
    # so whatever this final run records becomes the end-of-day price that the
    # weekly aggregation rolls up.
    #
    # Why 20:00 and not later: snapshot_date is the runner's UTC date, evaluated
    # per brand mid-run. The last run is started early enough to finish well
    # before the 00:00 UTC rollover, so a long run never splits one day's
    # snapshots across two calendar dates.
    - cron: "0 4,12,20 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Pull the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # SCRAPE_TARGET=shopify runs the no-proxy-by-default group: all Shopify
      # brands plus DeFacto and Mobaco (WooCommerce). LC Waikiki runs on its
      # own proxied workflow (scraper_lcw.yml) and is untouched by this change.
      #
      # DATAIMPULSE_PROXY_* (v14.31): a WAF is blocking the runner IP for a
      # subset of brands in this job (see scraper.py's DATAIMPULSE_PROXY_BRANDS
      # for the current, up-to-date list — it changes as brands recover or new
      # ones get blocked, so it's not duplicated here). Only those brands route
      # through the DataImpulse residential proxy; every other brand in this
      # job stays direct, so this doesn't add DataImpulse bandwidth cost for
      # brands that already work fine. Safe to leave these secrets unset for
      # runs that don't need them — the scraper falls back to a direct
      # connection with a warning rather than failing the whole job.
      - name: Run scraper (Shopify + DeFacto + WooCommerce group)
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:               ${{ secrets.SUPABASE_KEY }}
          # v14.37 egress fix: direct-Postgres URL for the variant preload.
          # If this is unset the scraper falls back to the PostgREST path.
          SUPABASE_DB_URL:            ${{ secrets.SUPABASE_DB_URL }}
          KHABAR_DB_URL: ${{ secrets.PLANETSCALE_DB_URL }}
          TELEGRAM_BOT_TOKEN:         ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCRAPE_TARGET:              shopify
          DATAIMPULSE_PROXY_USERNAME: ${{ secrets.DATAIMPULSE_PROXY_USERNAME }}
          DATAIMPULSE_PROXY_PASSWORD: ${{ secrets.DATAIMPULSE_PROXY_PASSWORD }}
          CHANGE_DETECT_ACTIVE: "1"
        run: python -u scraper.py
