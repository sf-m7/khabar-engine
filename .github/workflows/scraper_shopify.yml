name: Khabar Shopify Scraper

on:
  schedule:
    # 4x daily — every 6 hours.
    # Shopify brands use NO proxy (direct connection) so this costs
    # zero Webshare bandwidth regardless of frequency.
    # 4x daily gives us:
    #   - Intraday flash sale detection (L1·02) for all 5 Shopify brands
    #   - Stockout velocity within a 6-hour window (L1·08)
    #   - Cross-brand simultaneous discount detection (L1·16) at useful resolution
    # Brands: Town Team, Ravin, Men's Club, Tree, Dott Jeans
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Pull the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Shopify scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCRAPE_TARGET: shopify
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: python -u scraper.py
