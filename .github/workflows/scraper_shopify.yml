name: Khabar Shopify Scraper

on:
  schedule:
    # No-proxy group: all Shopify brands + DeFacto + Mobaco (WooCommerce).
    # Four runs daily at 01:00, 07:00, 13:00, 18:00 UTC.
    # The LAST run is 18:00 UTC = 21:00 Cairo (EEST), pulled back from 19:00 so
    # that GitHub scheduler delay can't push the end-of-day capture past Cairo
    # midnight. These brands cost zero proxy bandwidth, so run frequency is free.
    - cron: "0 1,7,13,18 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Pull the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Shopify + DeFacto + WooCommerce scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCRAPE_TARGET: shopify
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: python -u scraper.py
