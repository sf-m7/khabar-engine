name: TEST — compute pipeline on PlanetScale

# Manual only. Runs the weekly rollup, signal engine, and product builder
# against PlanetScale (reads hot PlanetScale + cold R2 via the lake, writes
# results back to PlanetScale). Proves the pipeline works there before cutover.
# Writing to PlanetScale is harmless now — it isn't live yet.
on:
  workflow_dispatch:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The switch — this whole test targets PlanetScale:
      KHABAR_DB_URL:        ${{ secrets.PLANETSCALE_DB_URL }}
      SUPABASE_DB_URL:      ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
      R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1) Weekly rollup (uses the copied DB functions)
        run: python -u rollup.py

      - name: 2) Signal engine (reads PlanetScale + R2 via the lake)
        run: python -u compute_signals.py

      - name: 3) Product builder (L2)
        run: python -u compute_products.py
