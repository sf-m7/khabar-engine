name: Khabar Price Scraper
on:
  schedule:
    # 4x daily (every 6 hours) — fits within 1GB/month Webshare proxy budget.
    #
    # BANDWIDTH MATH (only LCW uses proxy — Shopify brands go direct):
    #   LCW listing API: ~0MB (compressed persistent TCP connection)
    #   LCW size HTML pages: 40 pages × 164KB = 6.6MB per run
    #   Total per run: ~7MB (with headroom for retries)
    #   Monthly: 7MB × 4 runs × 30 days = 840MB ← fits 1GB with 160MB headroom
    #
    # WHY 4x:
    #   - Catches intraday price changes for flash sale detection (L1·02)
    #   - Size population completes in ~61 days instead of ~194 at 2x
    #   - Each run writes one daily snapshot per product (idempotent)
    #
    # ANTI-DETECTION:
    #   - Python startup jitter (0-30s random delay) staggers exact hit times
    #   - Per-page delays with random intervals built into scraper.py
    #   - curl_cffi Chrome TLS fingerprint impersonation
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Pull the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: python -u scraper.py
