name: Khabar Price Scraper
on:
  schedule:
    # Runs 4 times daily: midnight, 6am, noon, 6pm UTC
    # Egypt is UTC+3, so local times are: 3am, 9am, 3pm, 9pm
    # Midnight UTC run captures end-of-day prices for intelligence reports.
    # 4-hour interval gives 720 snapshots/product over 6 months — sufficient
    # for all Level 2 intelligence products in the Khabar playbook.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Pull the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: python -u scraper.py
