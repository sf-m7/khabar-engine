name: diag-fingerprint
on:
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi
      - name: Fingerprint sweep through the proxy
        env:
          DATAIMPULSE_PROXY_USERNAME: ${{ secrets.DATAIMPULSE_PROXY_USERNAME }}
          DATAIMPULSE_PROXY_PASSWORD: ${{ secrets.DATAIMPULSE_PROXY_PASSWORD }}
          DATAIMPULSE_HOST:           ${{ vars.DATAIMPULSE_HOST }}
          SHOPIFY_PROXY_COUNTRY:      ${{ vars.SHOPIFY_PROXY_COUNTRY }}
        run: python diag_fingerprint.py
