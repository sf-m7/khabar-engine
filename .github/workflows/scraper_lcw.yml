name: Khabar LCW Scraper

on:
  schedule:
    # 1x daily — midnight UTC only.
    # LCW uses the Webshare residential proxy (~29 MB/run).
    # 1x daily = 870 MB/month, fits within the 1 GB plan with ~150 MB headroom.
    # Headroom covers roughly 5 manual workflow_dispatch runs per month.
    #
    # Upgrade path: if Webshare moves to a 2 GB plan, change cron to
    # "0 0,12 * * *" (2x daily) and raise SIZE_CAP to 25 in scraper.py.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Pull the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run LCW scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          SCRAPE_TARGET: lcw
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: python -u scraper.py
