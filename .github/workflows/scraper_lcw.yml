name: LCW Scraper

# v14.42: single daily run at 18:37 UTC.
#
# The minute is deliberately NOT :00. GitHub queues every top-of-hour cron job
# across the platform at the same instant, so :00 schedules are the most
# contended slot there is — they get delayed under load and, when the queue is
# deep enough, dropped entirely. That is what produced the ~30 minute drift on
# earlier runs and the missed run on 2026-07-20 that left LCW 35 hours stale.
# An odd minute sidesteps the crush without changing the cadence.
#
# NOTE: the previous comment here described an hourly 06:00-21:00 schedule.
# That change was never applied — the cron underneath stayed '0 18 * * *' the
# whole time. Once daily is the intended design, so the comment was corrected
# to match the code rather than the code changed to match the comment.
#
# TRADEOFF, stated plainly: with one attempt per day, a bad DataImpulse proxy
# window costs the entire day and the next attempt is 24 hours out. LCW missed
# 2 of the last 8 days this way. Category-level checkpointing in scraper.py
# means a MANUAL re-run resumes rather than refetching, so recovery is cheap —
# but it has to be triggered by hand. If that ever becomes tiresome, adding a
# second cron at '37 21 * * *' would no-op in seconds on a day that already
# succeeded. Not enabled: once daily is the current, deliberate choice.

on:
  schedule:
    - cron: '37 18 * * *'
  workflow_dispatch:        # manual trigger, unchanged

concurrency:
  # Never let two LCW runs overlap — they would fight over the same
  # checkpoint rows and double-fetch the same categories.
  group: lcw-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # circuit breaker should abort long before this

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LCW scraper
        run: python -u scraper.py
        env:
          SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:                ${{ secrets.SUPABASE_KEY }}
          SUPABASE_DB_URL:             ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DATAIMPULSE_PROXY_USERNAME:  ${{ secrets.DATAIMPULSE_PROXY_USERNAME }}
          DATAIMPULSE_PROXY_PASSWORD:  ${{ secrets.DATAIMPULSE_PROXY_PASSWORD }}
          DATAIMPULSE_HOST:            ${{ vars.DATAIMPULSE_HOST }}
          SCRAPE_TARGET:               lcw
          LCW_SIZE_CAP:                ${{ vars.LCW_SIZE_CAP }}
          LCW_ROTATION_BUDGET:         ${{ vars.LCW_ROTATION_BUDGET }}
          # ── v14.39-41 knobs. All blank-safe: env_str/env_int treat a blank
          # repo variable exactly as unset, so leaving them undefined keeps
          # the documented defaults. Wired here so they can be changed from
          # the GitHub UI without a code edit or redeploy.
          LCW_PROXY_COUNTRY:           ${{ vars.LCW_PROXY_COUNTRY }}   # default tr; "eg" to roll back; "tr,sa" for a pool
          LCW_PAGE_TIMEOUT:            ${{ vars.LCW_PAGE_TIMEOUT }}    # default 12 (seconds)
          LCW_FORCE_HTTP1:             ${{ vars.LCW_FORCE_HTTP1 }}     # default 1; "0" to restore HTTP/2
          LCW_CHECKPOINT:              ${{ vars.LCW_CHECKPOINT }}      # default 1; "0" disables resume
          LCW_PAGE_ATTEMPTS:           ${{ vars.LCW_PAGE_ATTEMPTS }}   # default 3
          LCW_CIRCUIT_BREAKER:         ${{ vars.LCW_CIRCUIT_BREAKER }} # default 6
