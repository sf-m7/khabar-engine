name: LCW Scraper (bi-daily)

# LC Waikiki runs TWICE a day, 12h apart. The scraper's checkpoint is scoped by
# (date, slot), so the two runs keep separate progress and the second (pm) run
# re-crawls and catches intraday price moves instead of skipping as "already
# done today". LCW_SLOT tells the scraper which block this run is; without it
# the code falls back to a UTC-clock guess (am before 12:00, pm after), but we
# pass it explicitly so a manual re-trigger lands in the intended slot.
#
# Times are UTC. Evening-UTC windows are when the DataImpulse Turkey pool is
# healthiest, so both slots are placed in the more reliable half of the day:
#   05:00 UTC  = 07:00 Cairo  (am)
#   17:00 UTC  = 19:00 Cairo  (pm)
# Adjust if you find a better window, but keep the two ~12h apart.

on:
  schedule:
    - cron: '0 5 * * *'    # am slot
    - cron: '0 17 * * *'   # pm slot
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which slot to run as (am/pm). Leave blank for clock-based.'
        required: false
        default: ''

jobs:
  scrape-lcw:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine slot
        id: slot
        run: |
          # Priority: manual input > schedule cron > empty (clock fallback in code)
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "value=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            echo "value=am" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then
            echo "value=pm" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run LCW scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATAIMPULSE_PROXY_USERNAME: ${{ secrets.DATAIMPULSE_PROXY_USERNAME }}
          DATAIMPULSE_PROXY_PASSWORD: ${{ secrets.DATAIMPULSE_PROXY_PASSWORD }}
          SCRAPE_TARGET: lcw
          LCW_SLOT: ${{ steps.slot.outputs.value }}
        run: python -u scraper.py
