name: LCW Scraper

# v14.46: twice daily — a morning block at ~05:23-06:03 UTC and the original
# evening block at ~17:23-18:03 UTC.
#
# IMPORTANT: this schedule alone is not enough. scraper.py checkpoints
# categories BY DATE, so whichever block runs first marks the day complete and
# the second block exits as a no-op. Slot-aware checkpointing has to land in
# scraper.py for the second run to do any work at all.
#
# v14.41: hourly instead of once daily.
#
# Why: a single daily run that hits a bad proxy window loses the whole day,
# and the next attempt is 24 hours away. With category-level checkpointing in
# scraper.py, each run skips categories already completed today and only
# attempts the rest. Most runs will therefore be no-ops that exit in seconds.
#
# Cost: GitHub Actions minutes are free on public repos, so the extra runs are
# free. Proxy bandwidth is only spent on categories that still need fetching,
# so a completed day costs roughly nothing beyond one cheap DB read.
#
# The 06:00-21:00 window covers the day with margin; the previous single run
# was at 18:00 UTC.

on:
  schedule:
    # v14.43: one real attempt plus four retry slots, 20 minutes apart.
    #
    # GitHub cron cannot express "retry 10 minutes after the previous run
    # finished" — it only schedules by clock time, with no knowledge of the
    # outcome. The checkpoint table gives the same result: whichever attempt
    # succeeds first marks the categories complete, and every later attempt
    # reads that, skips the crawl, skips the size pass, and exits in seconds.
    # So the retries are effectively free unless they are actually needed.
    #
    # The first slot is 37 minutes before the original 18:00 so the whole
    # sequence lands on or before the time LCW used to be scraped.
    #
    # A failed run aborts in about 5 minutes via the circuit breaker, so a
    # 10-minute gap is comfortable. A SUCCESSFUL run takes roughly 12 minutes
    # plus the size pass, which can overrun the next slot — the concurrency
    # group below queues that attempt rather than running it in parallel, and
    # it then exits immediately as a no-op. No overlap, no double-scraping.
    # ── Evening block (unchanged) ───────────────────────────────────────
    - cron: '20,40 17 * * *'
    - cron: '0,20,40 18 * * *'
    # ── Morning block, 12 hours earlier ─────────────────────────────────
    # Same shape as the evening: one real attempt plus four retry slots ten
    # minutes apart, so a bad proxy window in the morning costs minutes
    # rather than half a day.
    - cron: '20,40 5 * * *'
    - cron: '0,20,40 6 * * *'
  workflow_dispatch:        # manual trigger, unchanged

concurrency:
  # Never let two LCW runs overlap — they would fight over the same
  # checkpoint rows and double-fetch the same categories.
  group: lcw-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # circuit breaker should abort long before this

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DIAGNOSTIC — isolate curl_cffi/chrome124/HTTP1.1 as the 403 trigger
        env:
          DATAIMPULSE_PROXY_USERNAME:  ${{ secrets.DATAIMPULSE_PROXY_USERNAME }}
          DATAIMPULSE_PROXY_PASSWORD:  ${{ secrets.DATAIMPULSE_PROXY_PASSWORD }}
        run: |
          python3 <<'PYEOF'
          import os
          from curl_cffi import requests

          USER = os.environ["DATAIMPULSE_PROXY_USERNAME"]
          PASS = os.environ["DATAIMPULSE_PROXY_PASSWORD"]
          HOST = "gw.dataimpulse.com"
          PORT = 15000  # fixed sticky port, same for all 3 tests below — isolates
                         # the client fingerprint, not a different proxy peer
          URL = ("https://www.lcwaikiki.eg/en/ajax/ProductList/ProductListPageData"
                 "?xhrKeys=CategoryTreeId,xhrKeys&CategoryTreeId=9&PageIndex=1&Layout=three-column")
          HEADERS = {
              "accept": "application/json, text/plain, */*",
              "accept-language": "en-US,en;q=0.9",
              "origin": "https://www.lcwaikiki.eg",
              "referer": "https://www.lcwaikiki.eg/en/men-clothing-t-9",
              "sec-fetch-dest": "empty", "sec-fetch-mode": "cors", "sec-fetch-site": "same-origin",
              "content-type": "application/json",
          }
          BODY = {"CategoryParameterList": [{"PropertyId": 67, "PropertyValueId": [10]},
                                             {"PropertyId": 63, "PropertyValueId": [57794]}],
                  "FilterListJson": "[]", "LastSeenOptionIdsJson": "[]"}

          def proxy_url(country):
              return f"http://{USER}__cr.{country}:{PASS}@{HOST}:{PORT}"

          def run_test(label, impersonate, http_version=None, country="tr"):
              print(f"\n=== {label} ===")
              try:
                  kwargs = {"proxies": {"https": proxy_url(country), "http": proxy_url(country)}}
                  if impersonate:
                      kwargs["impersonate"] = impersonate
                  session = requests.Session(**kwargs)
                  post_kwargs = {"headers": HEADERS, "json": BODY, "timeout": 20}
                  if http_version is not None:
                      post_kwargs["http_version"] = http_version
                  res = session.post(URL, **post_kwargs)
                  print(f"Status: {res.status_code}")
                  print(f"Body (first 300 chars): {res.text[:300]!r}")
              except Exception as e:
                  print(f"EXCEPTION: {type(e).__name__}: {e}")

          # Test 1: curl_cffi, no impersonation, default HTTP version — control,
          # closest to the plain-curl test that already succeeded cleanly.
          run_test("1. curl_cffi, no impersonate, default HTTP", impersonate=None)

          # Test 2: add chrome124 impersonation, still default HTTP version —
          # isolates whether the TLS/JA3 fingerprint alone triggers the 403.
          run_test("2. curl_cffi, impersonate=chrome124, default HTTP", impersonate="chrome124")

          # Test 3: chrome124 + HTTP/1.1 pinned — exact replica of what
          # scrape_lcw() actually sends in production (LCW_FORCE_HTTP1=1 default).
          try:
              from curl_cffi.const import CurlHttpVersion
              v1_1 = CurlHttpVersion.V1_1
          except Exception as e:
              print(f"Could not import CurlHttpVersion: {e}")
              v1_1 = None
          run_test("3. curl_cffi, impersonate=chrome124, HTTP/1.1 pinned (= production config)",
                    impersonate="chrome124", http_version=v1_1)
          PYEOF

      - name: Run LCW scraper
        run: python -u scraper.py
        env:
          SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:                ${{ secrets.SUPABASE_KEY }}
          SUPABASE_DB_URL:             ${{ secrets.SUPABASE_DB_URL }}
          KHABAR_DB_URL:               ${{ secrets.PLANETSCALE_DB_URL }}
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DATAIMPULSE_PROXY_USERNAME:  ${{ secrets.DATAIMPULSE_PROXY_USERNAME }}
          DATAIMPULSE_PROXY_PASSWORD:  ${{ secrets.DATAIMPULSE_PROXY_PASSWORD }}
          DATAIMPULSE_HOST:            ${{ vars.DATAIMPULSE_HOST }}
          # v14.64: Decodo removed — account cancelled 2026-10. scraper.py no
          # longer reads DECODO_PROXY_USER/PASS at all; nothing to wire here.
          SCRAPE_TARGET:               lcw
          # Which of the two daily blocks this run belongs to. Consumed by the
          # checkpoint so the morning and evening runs do not read each
          # other's completion state. Derived from the clock rather than
          # hardcoded, because a single workflow serves both blocks.
          LCW_SLOT:                    ${{ github.event.schedule && (contains(github.event.schedule, ' 5 ') || contains(github.event.schedule, ' 6 ')) && 'am' || 'pm' }}
          LCW_SIZE_CAP:                ${{ vars.LCW_SIZE_CAP }}
          LCW_ROTATION_BUDGET:         ${{ vars.LCW_ROTATION_BUDGET }}
          # ── v14.39-41 knobs. All blank-safe: env_str/env_int treat a blank
          # repo variable exactly as unset, so leaving them undefined keeps
          # the documented defaults. Wired here so they can be changed from
          # the GitHub UI without a code edit or redeploy.
          LCW_PROXY_COUNTRY:           ${{ vars.LCW_PROXY_COUNTRY }}   # default tr; "eg" to roll back; "tr,sa" for a pool
          LCW_PAGE_TIMEOUT:            ${{ vars.LCW_PAGE_TIMEOUT }}    # default 12 (seconds)
          LCW_FORCE_HTTP1:             ${{ vars.LCW_FORCE_HTTP1 }}     # default 1; "0" to restore HTTP/2
          LCW_CHECKPOINT:              ${{ vars.LCW_CHECKPOINT }}      # default 1; "0" disables resume
          LCW_PAGE_ATTEMPTS:           ${{ vars.LCW_PAGE_ATTEMPTS }}   # default 3
          LCW_CIRCUIT_BREAKER:         ${{ vars.LCW_CIRCUIT_BREAKER }} # default 6
          LCW_DEBUG_FIELDS:            ${{ vars.LCW_DEBUG_FIELDS }}
          CHANGE_DETECT_ACTIVE: "1"
