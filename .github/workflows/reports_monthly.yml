# .github/workflows/reports_monthly.yml
# Monthly client reports. Runs on the 1st at 06:30 UTC. Commits into /reports.

name: Reports (monthly)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 1 * *"

permissions:
  contents: write

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install psycopg2-binary pandas matplotlib duckdb

      - name: Brand Gap Map report
        env:
          SUPABASE_DB_URL:      ${{ secrets.SUPABASE_DB_URL }}
          KHABAR_DB_URL: ${{ secrets.PLANETSCALE_DB_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
        run: python report_gap_map.py

      - name: Brand Health report
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KHABAR_DB_URL: ${{ secrets.PLANETSCALE_DB_URL }}
        run: python report_brand_health.py

      - name: Commit reports
        run: |
          git config user.name  "khabar-bot"
          git config user.email "bot@khabar.local"
          git add reports/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "reports: monthly $(date -u +%Y-%m)"
          git pull --rebase origin main      # avoid racing a concurrent push
          git push
