# .github/workflows/integrity_audit.yml
# Runs the Khabar integrity audit. Fails the run (red X) on any CRITICAL issue.
# Manual: Actions tab -> Integrity Audit -> Run workflow.
# Scheduled: Mondays 05:00 UTC — AFTER the rollup/archive/housekeeping chain
# (03:00-04:00) so it audits the freshly-compacted state.

name: Integrity Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install psycopg2-binary duckdb

      - name: Run audit
        env:
          SUPABASE_DB_URL:      ${{ secrets.SUPABASE_DB_URL }}
          KHABAR_DB_URL: ${{ secrets.PLANETSCALE_DB_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
        run: python integrity_audit.py

      - name: Upload report
        if: always()   # keep the report even when the audit fails the build
        uses: actions/upload-artifact@v4
        with:
          name: integrity-report
          path: |
            integrity_report.md
            integrity_report.json
