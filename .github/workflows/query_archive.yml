name: Khabar Archive Query

on:
  workflow_dispatch:
    inputs:
      sql:
        description: "SQL question to ask the archive. The table is always called `archive` (every Parquet file in the folder, combined). Leave blank to see a default 'rows per brand' summary."
        type: string
        default: ""
      prefix:
        description: "Which folder in the bucket to read. Leave as price_snapshots for real archived data."
        type: string
        default: "price_snapshots"

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pull the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run query
        env:
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          ARCHIVE_QUERY_SQL:    ${{ inputs.sql }}
          ARCHIVE_QUERY_PREFIX: ${{ inputs.prefix }}
        run: python -u query_archive.py
