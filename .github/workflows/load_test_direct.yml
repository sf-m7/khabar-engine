name: load-test-direct
on:
  workflow_dispatch:
jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: python load_test_direct.py
