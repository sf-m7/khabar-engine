name: Khabar Weekly Compaction

# v2 (2026-07-13): changed from monthly (first-Monday-only) to WEEKLY.
# Reason: the LCW size backfill is currently active and growing
# product_variants fast (+18,000 rows in a single day observed), well
# outside normal steady-state growth. Monthly compaction left too much
# dead space accumulating for too long during this unusually active
# period. Revisit going back to monthly once the LCW backfill is complete
# and growth returns to steady-state (~11-16% dead rows/month observed
# under normal conditions, which monthly compaction handles fine).
#
# Schedule kept at Monday 06:00 UTC — deliberately AFTER Weekly Rollup
# (03:00) and Cold Archive + Housekeeping (04:00/05:00), so compaction
# always runs against a database that's already had its normal weekly
# archiving done first, and is clear of all automated daily jobs
# (scrapers run 00:00/12:00/18:00 UTC, bot polls every 6h). The one
# remaining risk is a MANUAL LCW backfill run overlapping this window —
# that's not something a schedule can prevent; avoid triggering manual
# backfill runs around Monday 06:00 UTC.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pull the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Run compaction
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -u compaction.py
