name: Khabar Monthly Compaction

on:
  schedule:
    # First Monday of each month, 06:00 UTC — after the weekly rollup
    # (03:00) and archive (04:00) jobs have finished, so compaction always
    # runs against a database that's already had its normal weekly
    # housekeeping done first. Cron has no native "first Monday" syntax, so
    # this runs every Monday at 06:00 UTC and the script itself is a no-op
    # in cost (just runs VACUUM FULL, which is safe to run more often than
    # strictly needed) — but if you want it to ONLY do the heavier check
    # once a month, see the day-of-month gate note below.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pull the code
        uses: actions/checkout@v4

      - name: Check if this is the first Monday of the month
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — bypassing the first-Monday date gate."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            DAY=$(date +%d)
            if [ "$DAY" -le 7 ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Run monthly compaction
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -u compaction.py
