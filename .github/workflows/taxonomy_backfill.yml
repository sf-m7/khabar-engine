name: Taxonomy Backfill

on:
  workflow_dispatch:
    inputs:
      pass:
        description: "Which pass to run"
        required: true
        default: "colors"
        type: choice
        options:
          - colors
          - subcat-rules
          - subcat-text
          - subcat-vision
          - audit
          - all
      vision_limit:
        description: "Max images for the vision pass (budget guard)"
        required: false
        default: "4000"
      audit_sample:
        description: "Sample size per category for the audit"
        required: false
        default: "40"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install psycopg2-binary requests

      - name: Run backfill pass
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_GEMINI_CALLS: "5000"
        run: |
          python taxonomy_backfill.py \
            --pass "${{ github.event.inputs.pass }}" \
            --vision-limit "${{ github.event.inputs.vision_limit }}" \
            --audit-sample "${{ github.event.inputs.audit_sample }}"
