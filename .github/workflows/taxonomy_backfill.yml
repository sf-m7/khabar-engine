name: Taxonomy Backfill

on:
  schedule:
    # Tuesdays 05:00 UTC — after Monday scraping completes, before Monday
    # report suite (12:00 UTC). Classifies any new products scraped that week.
    - cron: "0 5 * * 2"
  workflow_dispatch:
    inputs:
      pass:
        description: "Which pass to run"
        required: true
        default: "all"
        type: choice
        options:
          - colors
          - sizes
          - subcat-rules
          - subcat-text
          - all

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run backfill pass
        env:
          KHABAR_DB_URL: ${{ secrets.PLANETSCALE_DB_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python taxonomy_backfill.py --pass "${{ github.event.inputs.pass || 'all' }}"
